server {
  listen 80;
  client_max_body_size 50m;
  add_header X-Robots-Tag "noindex" always;
  location ~ ^/(health|sites|integrations|map|agents|auth|notifications|live|network|scan-batches|scan-config|cams|docs|openapi\.json|redoc) {
    proxy_pass http://cloud:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/index.html /index.html;
    add_header Cache-Control "no-cache";
    sub_filter_once on;
    sub_filter '</body>' '<div style="position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:99999;background:#f59e0b;color:#111;font:700 12px system-ui;letter-spacing:.12em;padding:3px 14px;border-radius:0 0 8px 8px;pointer-events:none">STAGING · test data · nothing leaves this box</div></body>';
  }
}
