# Dev overrides — auto-loaded by `docker compose up`.
# Bind-mounts source into the running containers so code changes hot-reload:
#   - cloud: uvicorn --reload restarts the API on .py changes
#   - web:   Vite HMR applies UI changes instantly
# Polling envs make file-change detection reliable across the macOS Docker mount.
# Schema (DB column/table) changes still need a fresh DB: `docker compose down -v`.
services:
  cloud:
    volumes:
      - ./cloud:/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  web_node_modules:
