[project]
name = "netmonitor-agent"
version = "2.0.0a0"
description = "NetMonitor 2.0 local monitoring agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.2"]

[project.scripts]
netmon-agent = "netmon_agent.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
