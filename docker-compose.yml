services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmonitor}
      POSTGRES_DB: ${POSTGRES_DB:-netmonitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netmonitor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  cloud:
    build: ./cloud
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmonitor}
      POSTGRES_DB: ${POSTGRES_DB:-netmonitor}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    # Runs migrations then starts the API.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build: ./web
    depends_on:
      - cloud
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"

volumes:
  pgdata:
