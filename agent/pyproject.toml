[project]
name = "netmonitor-agent"
version = "2.0.0a0"
description = "NetMonitor 2.0 local monitoring agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.2"]

[project.scripts]
netmon-agent = "netmon_agent.main:main"

[tool.ruff]
extend-exclude = ["build"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set so a new ruff release can't silently turn CI red:
# pyflakes (F) + the error-level pycodestyle checks (E4/E7/E9).
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]  # one-line `a = 1; b = 2` is the house style in migrations
