[project]
name = "netmonitor-cloud"
version = "2.0.0a0"
description = "NetMonitor 2.0 cloud backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "pywebpush>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.setuptools]
# The Docker image installs only the dependencies (the code is copied in
# separately), so there is nothing to package. Without this, `pip install .`
# fails in CI with "Multiple top-level packages discovered".
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pin the rule set so a new ruff release can't silently turn CI red:
# pyflakes (F) + the error-level pycodestyle checks (E4/E7/E9).
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]  # one-line `a = 1; b = 2` is the house style in migrations

[tool.pytest.ini_options]
asyncio_mode = "auto"
